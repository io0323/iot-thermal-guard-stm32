name: ci

on:
  push:
    branches: [main, "phase/**"]
  pull_request:

jobs:
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: ツール
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: ビルド（host-debug、ASan・UBSan）
        run: cmake --preset host-debug && cmake --build --preset host-debug

      - name: CTest（単体・ゴールデン）
        run: ctest --preset host-debug --output-on-failure

      - uses: astral-sh/setup-uv@v6

      - name: 契約テストキット
        run: uv tool install "iotspec @ git+https://github.com/io0323/iot-common-spec@v0.2.1"

      - name: 契約テスト（MQTT ブローカーは使わない）
        run: >-
          iotspec-contract --role mcu-c-01
          --target-cmd "./build/host/mcu_c_01 --log contract-log.jsonl {uart}"
          --junit contract.xml

      - name: 再起動の結合テスト（pty 越し、pytest）
        run: >-
          uv run --with "iotspec @ git+https://github.com/io0323/iot-common-spec@v0.2.1" --with pytest
          pytest tests/host_integration

      - name: 契約テストの結果とログ
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-mcu-c-01
          path: |
            contract.xml
            contract-log.jsonl
          if-no-files-found: warn

  quality:
    # 品質ゲート（P4）。手順は tools/quality.sh にまとめ、手元では tools/quality-docker.sh で同じものを流す。
    # 合否はこのジョブ（ubuntu-24.04、apt の cppcheck・clang-tidy・doxygen、gcc）の結果を正とする。
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: ツール（apt）
        run: sudo apt-get update && sudo apt-get install -y ninja-build cppcheck clang-tidy doxygen

      - uses: astral-sh/setup-uv@v6

      - name: ツール（uv）
        run: uv tool install lizard && uv tool install gcovr

      - name: 品質ゲート（カバレッジ・cppcheck・clang-tidy・lizard・Doxygen・禁止項目）
        run: tools/quality.sh build/quality

      - name: トレーサビリティ（FR・NFR と docs/test-spec.md、P7）
        if: always()
        run: python3 tools/check_traceability.py

      - name: 品質ゲートの報告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-report
          path: build/quality
          if-no-files-found: warn

  target:
    # ターゲット版（P5）。手順は tools/target.sh にまとめ、手元では tools/target-docker.sh で同じものを流す。
    # ツールチェーンは ubuntu-24.04 の apt の gcc-arm-none-eabi（ADR-0004）。実機への書き込みはしない。
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: ツール（apt）
        run: sudo apt-get update && sudo apt-get install -y ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi

      - name: ビルド（target-debug・target-release）、サイズ、スタック
        run: tools/target.sh build/target-report

      - name: .elf・.map・報告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: target-report
          path: build/target-report
          if-no-files-found: warn

  renode:
    # Renode（P6）。target-renode（ADC_SOFTWARE_START=1、実機とは ADC の開始方法が違う）を、循環・半分転送の DMA を
    # 足したプラットフォーム定義で動かす（ADR-0006）。Renode は antmicro/renode:1.16.1（digest で固定）のコンテナ。
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: ツール（apt）
        run: sudo apt-get update && sudo apt-get install -y ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi

      - name: target-renode
        run: cmake --preset target-renode && cmake --build --preset target-renode

      - name: target-renode の ISR（TIM2 の更新割り込みは target-renode だけ）
        run: mkdir -p build/renode-test && python3 tools/isr_report.py build/target-renode/mcu_c_01.elf | tee build/renode-test/isr.txt
        shell: bash

      - name: Renode のテスト（Robot Framework、Renode の既定の時間の設定）
        run: tools/renode-test.sh build/renode-test

      - name: スタックの塗りの余白（64 バイト）で stack_peak が変わらないこと（#54）
        run: tools/renode-stack-margin.sh build/renode-test/stack-margin

      - name: 仮想時間と実時間の比（契約テストの許容範囲 0.7〜9 倍の外なら、契約テストより先に失敗させる）
        shell: bash  # -eo pipefail（tee の前の失敗を落とさない）
        run: tools/renode-contract.sh --measure 20 | tee build/renode-test/time-ratio.txt

      - uses: astral-sh/setup-uv@v6

      - name: 契約テストキット
        run: uv tool install "iotspec @ git+https://github.com/io0323/iot-common-spec@v0.2.1"

      - name: 契約テスト（Renode）
        run: >-
          RENODE_LOG=build/renode-test/contract-renode.log RENODE_RELAY_LOG=build/renode-test/contract-relay.log
          iotspec-contract --role mcu-c-01 --target-cmd "tools/renode-contract.sh {uart}"
          --junit build/renode-test/contract-renode.xml

      - name: Renode のテストと契約テストの結果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renode-report
          path: build/renode-test
          if-no-files-found: warn
